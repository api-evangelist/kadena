aid: kadena
name: Kadena
description: >-
  Kadena was a layer-1 Proof-of-Work blockchain platform built around Chainweb, a
  braided, parallelized Nakamoto-consensus protocol that scales Bitcoin-style
  security across many chains for high transaction throughput, together with Pact,
  its human-readable, Turing-incomplete smart-contract language. Kadena exposed two
  primary public APIs: the Chainweb Node API (P2P and service endpoints for cuts,
  blocks, headers, payloads, the mempool, mining, and node info) and the Pact REST
  API (local, send, poll, listen, spv) for submitting and querying smart-contract
  transactions on mainnet and testnet. The developer surface includes the kadena.js
  TypeScript client libraries, the pactjs CLI for type generation, and extensive
  docs at docs.kadena.io. Kadena Eco supported an ecosystem of dApps, the Marmalade
  NFT standard, and tooling. NOTE: Kadena the company announced it would cease
  operations on 2025-10-21; Kadena Mainnet stopped producing blocks on 2025-11-15
  and the kadena-io GitHub organization was archived on 2025-12-23. A community
  edition (kda-community) forked from mainnet on 2025-11-08 and continues the
  open-source protocol. This profile documents the public API surface as published.
